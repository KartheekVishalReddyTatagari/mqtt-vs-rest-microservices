# Eclipse Mosquitto 2.0.20 configuration for the benchmark.
# Every value that affects delivery is set explicitly and documented.
# (Mosquitto does not allow comments on the same line as a setting.)

listener 1883
# Lab setup on an isolated Docker network; TLS and authentication are out of scope.
allow_anonymous true

# Persistence: the in-memory store (sessions, queued QoS 1/2 messages) is saved
# to /mosquitto/data every autosave_interval seconds and on a clean shutdown.
# An abrupt kill loses whatever changed since the last save (experiment E6).
persistence true
persistence_location /mosquitto/data/
autosave_interval 10

# Queue limits per client. Mosquitto's default of 1000 queued messages would drop
# most of a 60 s outage at 500 msg/s, so the limit is raised well above the largest
# backlog the experiments can create (60 s x 1000 msg/s = 60,000).
max_queued_messages 200000
# No byte limit on the queue.
max_queued_bytes 0
# Per client: outgoing QoS 1/2 messages awaiting acknowledgement.
max_inflight_messages 100

# Send small packets immediately, as the HTTP stack does.
set_tcp_nodelay true

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
