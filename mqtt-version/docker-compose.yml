# MQTT version: Sensor Simulator -> Mosquitto -> Processing -> Mosquitto -> Alert
#
#   docker volume create mqtt-vs-rest-results     (once)
#   docker compose up --build --abort-on-container-exit --exit-code-from sensor-simulator
#   docker compose down -v                         (removes the broker's data, never the results)
#
# Settings come from the shell or an .env file, e.g. RUN_ID=test1 RATE=100 MQTT_QOS=1.
# Normally the experiment runner (experiments/runner.py) drives this file.
# Results go to the shared volume "mqtt-vs-rest-results" under mqtt/<RUN_ID>/.

name: mqtt-version

x-env: &env
  RUN_ID: ${RUN_ID:-dev}
  RESULTS_DIR: /results/mqtt/${RUN_ID:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  THRESHOLD: ${THRESHOLD:-30}
  MQTT_HOST: broker
  MQTT_PORT: 1883
  MQTT_QOS: ${MQTT_QOS:-1}
  SESSION_EXPIRY_S: ${SESSION_EXPIRY_S:-300}
  MQTT_KEEPALIVE_S: ${MQTT_KEEPALIVE_S:-10}
  MQTT_MAX_INFLIGHT: ${MQTT_MAX_INFLIGHT:-100}

x-service: &service
  build:
    context: ..
    dockerfile: mqtt-version/Dockerfile
  image: mqtt-vs-rest/mqtt:latest
  volumes:
    - results:/results
  cap_add:
    - NET_ADMIN

x-readycheck: &readycheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
  interval: 2s
  timeout: 3s
  retries: 15

services:
  broker:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok", "-q", "0"]
      interval: 2s
      timeout: 3s
      retries: 15

  alert:
    <<: *service
    command: ["python", "-m", "mqtt_services.alert"]
    environment:
      <<: *env
    healthcheck: *readycheck
    depends_on:
      broker:
        condition: service_healthy

  processing:
    <<: *service
    command: ["python", "-m", "mqtt_services.processing"]
    environment:
      <<: *env
    healthcheck: *readycheck
    depends_on:
      alert:
        condition: service_healthy

  sensor-simulator:
    <<: *service
    command: ["python", "-m", "mqtt_services.sensor_simulator"]
    environment:
      <<: *env
      RATE: ${RATE:-10}
      DURATION_S: ${DURATION_S:-10}
      SEED: ${SEED:-42}
      SENSOR_COUNT: ${SENSOR_COUNT:-5}
      SPIKE_PROBABILITY: ${SPIKE_PROBABILITY:-0.02}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-1000}
      MISSED_DEADLINE_MS: ${MISSED_DEADLINE_MS:-10}
      ACK_TIMEOUT_S: ${ACK_TIMEOUT_S:-120}
    depends_on:
      processing:
        condition: service_healthy
    restart: "no"

volumes:
  results:
    name: mqtt-vs-rest-results
    external: true
  broker-data:
